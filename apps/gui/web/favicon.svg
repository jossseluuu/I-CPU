<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- I-CPU: la luna (de "Umbra", el nombre original) sobre un chip; los tres
       pixeles de colores son los datos que se esconden en la imagen. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3350"/>
      <stop offset="1" stop-color="#121624"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9cdf7"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="32" height="32" fill="#fff"/>
      <circle cx="20.2" cy="11.6" r="7.4" fill="#000"/>
    </mask>
  </defs>
  <!-- patillas del chip -->
  <g fill="#7c83c9" opacity=".75">
    <rect x="9" y="0" width="2" height="2.6" rx=".6"/><rect x="15" y="0" width="2" height="2.6" rx=".6"/><rect x="21" y="0" width="2" height="2.6" rx=".6"/>
    <rect x="9" y="29.4" width="2" height="2.6" rx=".6"/><rect x="15" y="29.4" width="2" height="2.6" rx=".6"/><rect x="21" y="29.4" width="2" height="2.6" rx=".6"/>
    <rect x="0" y="9" width="2.6" height="2" ry=".6"/><rect x="0" y="15" width="2.6" height="2" ry=".6"/><rect x="0" y="21" width="2.6" height="2" ry=".6"/>
    <rect x="29.4" y="9" width="2.6" height="2" ry=".6"/><rect x="29.4" y="15" width="2.6" height="2" ry=".6"/><rect x="29.4" y="21" width="2.6" height="2" ry=".6"/>
  </g>
  <rect x="2" y="2" width="28" height="28" rx="7" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="27" height="27" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <circle cx="15" cy="14.6" r="8" fill="url(#moon)" mask="url(#crescent)"/>
  <circle cx="23.2" cy="7.6" r=".9" fill="#ffffff" opacity=".8"/>
  <rect x="9.4" y="22.4" width="3.2" height="3.2" rx=".7" fill="#60a5fa"/>
  <rect x="14.2" y="24" width="3.2" height="3.2" rx=".7" fill="#a78bfa"/>
  <rect x="19" y="22.4" width="3.2" height="3.2" rx=".7" fill="#34d399"/>
</svg>
