<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="I-CPU, Image Covert Processing Unit: esteganografía cifrada en imágenes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2140"/>
      <stop offset=".55" stop-color="#121628"/>
      <stop offset="1" stop-color="#0c0f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".22" cy=".45" r=".5">
