      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridfade"><rect width="1280" height="340" fill="url(#fade)"/></mask>
  </defs>

  <rect width="1280" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="22" fill="url(#glow)"/>

