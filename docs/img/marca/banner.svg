  <!-- Texto -->
  <g font-family="'Segoe UI', Inter, system-ui, sans-serif">
    <text x="320" y="138" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-2">I-CPU</text>
    <text x="324" y="180" font-size="24" font-weight="500" fill="#c7cbf5" letter-spacing=".5"><tspan font-weight="800" fill="#a5a8ff">I</tspan>mage <tspan font-weight="800" fill="#a5a8ff">C</tspan>overt <tspan font-weight="800" fill="#a5a8ff">P</tspan>rocessing <tspan font-weight="800" fill="#a5a8ff">U</tspan>nit</text>
