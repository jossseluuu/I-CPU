<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Modelo de seguridad de la GUI: servidor local con token y comprobación de Host">
  <style>
    .bg { fill: #ffffff; stroke: #e6e7eb; }
    .t { font: 700 20px 'Segoe UI', Inter, system-ui, sans-serif; fill: #111318; }
    .st { font: 400 13.5px 'Segoe UI', Inter, system-ui, sans-serif; fill: #6b7180; }
    .zone { fill: #f7f7f8; stroke: #d4d6dc; stroke-dasharray: 6 5; }
    .box { fill: #ffffff; stroke: #d4d6dc; }
    .in { fill: #eef0ff; stroke: #c7c9fb; } .bad { fill: #fdecec; stroke: #f3c3c3; } .ok { fill: #e9f7ee; stroke: #b9e3c8; }
    .h { font: 700 14px 'Segoe UI', Inter, system-ui, sans-serif; fill: #111318; }
    .zl { font: 800 11px 'Segoe UI', Inter, system-ui, sans-serif; fill: #6b7180; letter-spacing: 1.4px; }
    .p { font: 400 12px 'Segoe UI', Inter, system-ui, sans-serif; fill: #3c4049; }
    .m { font: 500 11.5px ui-monospace, 'Cascadia Mono', Consolas, monospace; fill: #4f46e5; }
    .x { font: 800 16px 'Segoe UI', Inter, system-ui, sans-serif; fill: #c62828; }
    .v { font: 800 15px 'Segoe UI', Inter, system-ui, sans-serif; fill: #15803d; }
    .a { stroke: #4f46e5; stroke-width: 2; fill: none; } .ah { fill: #4f46e5; }
    .ab { stroke: #e08a8a; stroke-width: 2; fill: none; stroke-dasharray: 6 5; } .abh { fill: #e08a8a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #15181e; stroke: #262b35; } .zone { fill: #1a1d24; stroke: #343a46; } .box { fill: #15181e; stroke: #343a46; }
      .in { fill: #20223a; stroke: #3b3e6b; } .bad { fill: #2c1517; stroke: #5a2a2d; } .ok { fill: #12261a; stroke: #24502f; }
      .t, .h { fill: #eceef2; } .st, .zl { fill: #8f97a6; } .p { fill: #c7cbd3; } .m { fill: #a5a8ff; } .x { fill: #f87171; } .v { fill: #4ade80; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="abh"/></marker>
  </defs>
  <rect class="bg" x=".5" y=".5" width="1199" height="469" rx="16"/>
  <text class="t" x="32" y="46">La GUI: un servidor que solo atiende a su propia pestaña</text>
  <text class="st" x="32" y="70">icpu-gui maneja contraseñas y ficheros privados, así que cualquier otra cosa que intente hablarle se rechaza antes de llegar a la API.</text>

  <rect class="zone" x="32" y="92" width="760" height="350" rx="16"/>
  <text class="zl" x="50" y="116">TU EQUIPO</text>

  <g transform="translate(56 132)"><rect class="in" width="250" height="140" rx="12"/>
    <text class="h" x="16" y="28">Pestaña de I-CPU</text>
    <text class="p" x="16" y="52">Abierta con el enlace de la consola:</text>
    <text class="m" x="16" y="74">127.0.0.1:PUERTO/#t=TOKEN</text>
    <text class="p" x="16" y="98">El token va en el fragmento (#), que el</text>
    <text class="p" x="16" y="116">navegador nunca envía en la URL.</text></g>

  <g transform="translate(480 132)"><rect class="box" width="288" height="290" rx="12"/>
    <text class="h" x="16" y="28">icpu-gui.exe</text>
    <text class="p" x="16" y="50">escucha solo en 127.0.0.1</text>
    <g transform="translate(16 66)"><rect class="ok" width="256" height="48" rx="8"/>
      <text class="p" x="12" y="20"><tspan font-weight="700">1 · Host</tspan> = 127.0.0.1 o localhost</text><text class="p" x="12" y="38">frena el «DNS rebinding»</text></g>
    <g transform="translate(16 122)"><rect class="ok" width="256" height="48" rx="8"/>
      <text class="p" x="12" y="20"><tspan font-weight="700">2 · X-ICPU-Token</tspan> en cada /api/</text><text class="p" x="12" y="38">128 bits, comparado en tiempo constante</text></g>
    <g transform="translate(16 178)"><rect class="ok" width="256" height="48" rx="8"/>
      <text class="p" x="12" y="20"><tspan font-weight="700">3 · CSP estricta</tspan>, sin scripts inline</text><text class="p" x="12" y="38">nunca innerHTML con datos</text></g>
    <text class="p" x="16" y="250">La web va embebida en el .exe y no</text>
    <text class="p" x="16" y="268">carga nada de Internet.</text></g>

  <path class="a" d="M306 190 H476" marker-end="url(#ar)"/>
  <text class="p" x="322" y="180">petición con el token</text>
  <text class="v" x="440" y="182">✓</text>

  <g transform="translate(56 300)"><rect class="bad" width="250" height="122" rx="12"/>
    <text class="h" x="16" y="28">Otra web abierta</text>
    <text class="p" x="16" y="52">No conoce el token y no puede añadir</text>
    <text class="p" x="16" y="70">cabeceras a otro origen sin CORS, que</text>
    <text class="p" x="16" y="88">el servidor nunca concede.</text></g>
  <path class="ab" d="M306 350 H476" marker-end="url(#arb)"/>
  <text class="x" x="372" y="342">✕ 403</text>

  <g transform="translate(832 132)"><rect class="bad" width="336" height="138" rx="12"/>
    <text class="h" x="16" y="28">La red (Wi-Fi, LAN, Internet)</text>
    <text class="p" x="16" y="52">No hay nada escuchando hacia fuera:</text>
    <text class="p" x="16" y="70">el puerto solo existe en 127.0.0.1.</text>
    <text class="p" x="16" y="96">Ninguna imagen ni contraseña sale</text>
    <text class="p" x="16" y="114">del equipo.</text></g>
  <path class="ab" d="M832 200 H772" marker-end="url(#arb)"/>
  <text class="x" x="790" y="192">✕</text>

  <g transform="translate(832 290)"><rect class="box" width="336" height="152" rx="12"/>
    <text class="h" x="16" y="28">Lo que no cubre</text>
    <text class="p" x="16" y="52">Un programa malicioso que ya se ejecuta</text>
    <text class="p" x="16" y="70">con tu usuario puede leer la memoria o el</text>
    <text class="p" x="16" y="88">teclado: ninguna aplicación te protege</text>
    <text class="p" x="16" y="106">de eso. Mantén el equipo limpio y</text>
    <text class="p" x="16" y="124">actualizado.</text></g>
</svg>
