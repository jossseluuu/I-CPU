name: Informar de un fallo
description: Algo no funciona como debería
labels: ["fallo"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por informar! **No pegues contraseñas reales ni subas imágenes con mensajes privados.**
        Si es un problema de seguridad, no abras un issue: usa **Security → Report a vulnerability**.
  - type: input
    id: version
    attributes:
      label: Versión
      description: Salida de `icpu version`
      placeholder: icpu 1.0.0
    validations:
      required: true
  - type: dropdown
    id: interfaz
    attributes:
      label: Interfaz
      options:
        - CLI (icpu)
        - GUI (icpu-gui)
        - Biblioteca (icpu_core)
        - Compilación
    validations:
      required: true
  - type: input
    id: so
    attributes:
      label: Sistema operativo
      placeholder: Windows 11 23H2 / Ubuntu 24.04 ...
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Comando exacto (sin la contraseña) o qué pulsaste en la GUI, y el formato y tamaño de la imagen.
      placeholder: |
        1. icpu embed foto.jpg -o salida.jpg -m "prueba"
        2. icpu extract salida.jpg
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true
  - type: textarea
    id: ocurrido
    attributes:
      label: Qué pasó en realidad
      description: Incluye el mensaje de error completo y el código de salida si lo hay.
      render: text
    validations:
      required: true
